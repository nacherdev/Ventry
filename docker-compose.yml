version: '3.8'
services:
  # Servicio de Base de Datos
  database:
    image: postgres:15-alpine
    container_name: daw_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servicio Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daw_backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
    depends_on:
      - database

volumes:
  postgres_data: